<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>آلبوم سالن زیبایی گل</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Tahoma,Arial,sans-serif}
body{min-height:100vh;background:radial-gradient(circle at 50% 20%,#742746,#3b0d20 55%,#18050c);color:#fff;display:flex;justify-content:center;align-items:center;overflow-x:hidden}
.wrap{width:100%;max-width:1150px;text-align:center;padding:12px}
h1{font-size:clamp(18px,3vw,28px);margin:0 0 5px}.hint{font-size:13px;opacity:.85;margin-bottom:10px}
.book-shell{width:100%;height:min(76vh,700px);min-height:430px;display:flex;justify-content:center;align-items:center;filter:drop-shadow(0 25px 25px rgba(0,0,0,.55))}
#book{margin:auto}
.page{background:#fff;overflow:hidden;box-shadow:inset 0 0 18px rgba(0,0,0,.12)}
.page img{width:100%;height:100%;object-fit:contain;object-position:center;display:block;background:#fff;pointer-events:none}
.cover-page{background:#4f1029;border:6px solid #4f1029;box-shadow:inset 0 0 0 2px #c8a35d}
.cover-page img{object-fit:cover;object-position:center}
.back-cover{background:linear-gradient(135deg,#5a1630,#350b1d);display:flex;align-items:center;justify-content:center;border:6px solid #4f1029;box-shadow:inset 0 0 0 2px #c8a35d}
.back-cover span{font-size:24px;font-weight:bold;color:#e3c785}
.controls{display:flex;gap:10px;justify-content:center;margin-top:8px}
button{border:1px solid #c8a35d;background:#fff;color:#501229;border-radius:999px;padding:9px 18px;font:inherit;cursor:pointer}
.status{font-size:13px;margin-top:7px;opacity:.9}
@media(max-width:700px){.book-shell{height:68vh;min-height:390px}.wrap{padding:7px}}
</style>
</head>
<body>
<div class="wrap">
<h1>آلبوم سالن زیبایی گل</h1>
<div class="hint">جلد یا گوشه صفحه را با ماوس/انگشت بگیرید و ورق بزنید</div>
<div class="book-shell">
 <div id="book">
   <div class="page back-cover" data-density="hard"><span>سالن زیبایی گل</span></div>
   <div class="page"><img src="images/page4.jpg" alt="صفحه ۴"></div>
   <div class="page"><img src="images/page3.jpg" alt="صفحه ۳"></div>
   <div class="page"><img src="images/page2.jpg" alt="صفحه ۲"></div>
   <div class="page"><img src="images/page1.png" alt="صفحه ۱"></div>
   <div class="page cover-page" data-density="hard"><img src="images/cover.jpg" alt="جلد"></div>
 </div>
</div>


</div>

<script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.min.js"></script>
<script>
window.addEventListener("load", function(){
 const status=document.getElementById("status");
 if(!window.St || !St.PageFlip){
   status.textContent="برای اجرای کتاب، اتصال اینترنت لازم است.";
   return;
 }
 const pageFlip=new St.PageFlip(document.getElementById("book"),{
   width:420,height:600,
   size:"stretch",
   minWidth:280,maxWidth:520,
   minHeight:400,maxHeight:740,
   maxShadowOpacity:.55,
   showCover:true,
   startZIndex:0,
   mobileScrollSupport:false,
   usePortrait:true,
   flippingTime:900,
   swipeDistance:20,
   useMouseEvents:true,
   autoSize:true,
   drawShadow:true
 });
 pageFlip.loadFromHTML(document.querySelectorAll(".page"));
 // Persian books begin with the front cover on the right.
 setTimeout(()=>pageFlip.turnToPage(5), 80);
 // Going forward means turning the right-hand leaf toward the left.
});
</script>
</body>
</html>
